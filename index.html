<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>碧罗雪山老窝火腿 · 3D包装</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1a140e;color:#f4ead6;font-family:"Songti SC","STSong","serif"}
#s{position:fixed;inset:0}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:3}
header,footer{position:fixed;z-index:2;left:0;right:0;pointer-events:none}
header{top:22px;padding:0 24px}
h1{margin:0;font-size:20px;letter-spacing:.2em;font-weight:500}
header p{margin:8px 0 0;font-size:12px;letter-spacing:.16em;color:#d8c39a}
footer{bottom:22px;text-align:center}
.bar{pointer-events:auto;display:inline-flex;gap:8px;background:rgba(20,14,8,.55);padding:8px;border-radius:999px;border:1px solid rgba(196,160,86,.28)}
button{border:0;background:transparent;color:#f4ead6;padding:10px 16px;border-radius:999px;letter-spacing:.14em;cursor:pointer;font:inherit}
button.on,button:hover{background:#c4a056;color:#2a1c0a}
.hint{margin-top:8px;font-size:11px;color:#cbb892;letter-spacing:.12em}
</style>
</head>
<body>
<div id="s"></div>
<div id="err">三维资源加载失败，请换网络后刷新。</div>
<header><div><h1>碧罗雪山老窝火腿</h1><p>云上良品 · 千年贡腿 · 三年陈化 · 3000g</p></div></header>
<footer>
  <div class="bar">
    <button id="btnSpin" class="on">自动旋转</button>
    <button id="btnOpen">开盒</button>
    <button id="btnReset">正面</button>
  </div>
  <div class="hint">拖动旋转 · 滚轮缩放</div>
</footer>
<script>
(function(){
  const CDNS = [
    "https://cdn.bootcdn.net/ajax/libs/three.js/0.160.0/three.min.js",
    "https://cdn.staticfile.net/three.js/0.160.0/three.min.js",
    "https://lib.baomitu.com/three.js/0.160.0/three.min.js",
    "https://cdn.jsdmirror.com/npm/three@0.160.0/build/three.min.js",
    "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"
  ];
  function load(src){
    return new Promise(function(res,rej){
      var s=document.createElement("script");
      s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s);
    });
  }
  async function boot(){
    for (var i=0;i<CDNS.length;i++){
      try { await load(CDNS[i]); if (window.THREE) return start(); } catch(e){}
    }
    document.getElementById("err").style.display="flex";
  }
  function start(){
    var THREE=window.THREE;
    function tex(draw,w,h){
      var c=document.createElement("canvas"); c.width=w; c.height=h;
      draw(c.getContext("2d"),w,h);
      return new THREE.CanvasTexture(c);
    }
    function mountains(g,x,y,w,h){
      g.strokeStyle="#d4b36a"; g.lineWidth=3; g.beginPath();
      var pts=[[0,.7],[.12,.45],[.22,.58],[.34,.22],[.46,.4],[.55,.12],[.66,.38],[.78,.28],[.9,.5],[1,.68]];
      pts.forEach(function(p,i){var X=x+p[0]*w,Y=y+p[1]*h; i?g.lineTo(X,Y):g.moveTo(X,Y)});
      g.stroke();
    }
    var topT=tex(function(g,w,h){
      g.fillStyle="#f3ead8"; g.fillRect(0,0,w,h);
      g.fillStyle="#111"; g.fillRect(48,48,w-96,h-96);
      g.strokeStyle="#c4a056"; g.lineWidth=6; g.strokeRect(64,64,w-128,h-128);
      g.fillStyle="#c4a056"; g.font="28px serif"; g.fillText("云上良品",96,130);
      g.textAlign="center";
      g.font="bold 64px serif"; g.fillText("碧罗雪山老窝火腿",w/2,250);
      g.font="24px serif"; g.fillText("BI LUO XUE SHAN LAO WO",w/2,305);
      g.font="26px serif"; g.fillText("千年贡腿 · 碧罗雪山",w/2,360);
      mountains(g,120,420,w-240,340);
      g.font="22px serif"; g.textAlign="left"; g.fillText("非遗 · 贡",96,h-110);
      g.textAlign="right"; g.fillText("净含量 3000g",w-96,h-110);
    },1024,720);
    var sideT=tex(function(g,w,h){
      g.fillStyle="#f3ead8"; g.fillRect(0,0,w,h);
      g.fillStyle="#c4a056"; g.textAlign="center";
      g.font="bold 48px serif"; g.fillText("碧罗雪山老窝火腿",w/2,h/2-8);
      g.font="22px serif"; g.fillText("千年贡腿 · 碧罗雪山",w/2,h/2+36);
    },1024,320);
    var innerT=tex(function(g,w,h){
      g.fillStyle="#111"; g.fillRect(0,0,w,h);
      mountains(g,80,80,w-160,h-280);
      g.fillStyle="#c4a056"; g.textAlign="center";
      g.font="42px serif"; g.fillText("碧罗雪山",w/2,h-80);
    },1024,720);
    var botT=tex(function(g,w,h){
      g.fillStyle="#f3ead8"; g.fillRect(0,0,w,h);
      g.strokeStyle="#c4a056"; g.strokeRect(40,40,w-80,h-80);
      g.fillStyle="#c4a056"; g.textAlign="center";
      g.font="40px serif"; g.fillText("云上良品",w/2,h/2);
      g.font="22px serif"; g.fillText("碧罗雪山老窝火腿  3000g",w/2,h/2+48);
    },1024,720);
    var scene=new THREE.Scene(); scene.background=new THREE.Color(0x1a140e);
    var camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.1,80);
    camera.position.set(4.6,3.4,6.2);
    var renderer=new THREE.WebGLRenderer({antialias:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.setSize(innerWidth,innerHeight);
    document.getElementById("s").appendChild(renderer.domElement);
    scene.add(new THREE.AmbientLight(0xffe6c0,.85));
    var key=new THREE.DirectionalLight(0xfff1d0,1.5); key.position.set(5,8,4); scene.add(key);
    scene.add(new THREE.HemisphereLight(0xffe6b8,0x2a1c12,.4));
    function mat(t){return new THREE.MeshStandardMaterial({map:t,roughness:.55,metalness:.05})}
    var cream=new THREE.MeshStandardMaterial({color:0xf3ead8,roughness:.7});
    var W=3.8,H=.92,D=2.55;
    var closed=new THREE.Group();
    closed.add(new THREE.Mesh(new THREE.BoxGeometry(W,H,D),[mat(sideT),mat(sideT),mat(topT),mat(botT),mat(sideT),mat(sideT)]));
    scene.add(closed);
    var openG=new THREE.Group(); openG.visible=false;
    var base=new THREE.Mesh(new THREE.BoxGeometry(W,H*.62,D),cream); base.position.y=-H*.19;
    var ham=new THREE.Mesh(new THREE.CapsuleGeometry(.38,1.35,8,16), new THREE.MeshStandardMaterial({color:0x8a3a32,roughness:.45}));
    ham.rotation.z=Math.PI/2; ham.position.set(.2,.42,0);
    var lid=new THREE.Mesh(new THREE.BoxGeometry(W,.1,D),[cream,cream,mat(topT),mat(innerT),cream,cream]);
    lid.position.set(-W*.55,1.15,0); lid.rotation.z=Math.PI/2.15;
    openG.add(base,ham,lid); scene.add(openG);
    var gnd=new THREE.Mesh(new THREE.CircleGeometry(4.2,64), new THREE.MeshStandardMaterial({color:0x2a2218,roughness:1}));
    gnd.rotation.x=-Math.PI/2; gnd.position.y=-H/2-.01; scene.add(gnd);
    var spin=true, opened=false, dragging=false, lx=0, ly=0, target={x:0,y:0};
    document.getElementById("btnSpin").onclick=function(){spin=!spin; this.classList.toggle("on",spin)};
    document.getElementById("btnOpen").onclick=function(){
      opened=!opened; closed.visible=!opened; openG.visible=opened;
      this.textContent=opened?"合上":"开盒"; this.classList.toggle("on",opened);
    };
    document.getElementById("btnReset").onclick=function(){camera.position.set(4.6,3.4,6.2); target.x=0; target.y=0};
    renderer.domElement.addEventListener("pointerdown",function(e){dragging=true; lx=e.clientX; ly=e.clientY; spin=false; document.getElementById("btnSpin").classList.remove("on")});
    addEventListener("pointerup",function(){dragging=false});
    addEventListener("pointermove",function(e){
      if(!dragging) return;
      target.y += (e.clientX-lx)*0.005; target.x += (e.clientY-ly)*0.005;
      target.x=Math.max(-0.6,Math.min(0.8,target.x));
      lx=e.clientX; ly=e.clientY;
    });
    renderer.domElement.addEventListener("wheel",function(e){
      e.preventDefault();
      var s=e.deltaY>0?1.08:0.92;
      camera.position.multiplyScalar(s);
      if(camera.position.length()<4) camera.position.setLength(4);
      if(camera.position.length()>14) camera.position.setLength(14);
    },{passive:false});
    addEventListener("resize",function(){
      camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);
    });
    (function tick(){
      requestAnimationFrame(tick);
      if(spin){ closed.rotation.y+=0.006; openG.rotation.y+=0.006; }
      closed.rotation.x += (target.x-closed.rotation.x)*0.08;
      openG.rotation.x += (target.x-openG.rotation.x)*0.08;
      if(!spin){ closed.rotation.y += (target.y-closed.rotation.y)*0.08; openG.rotation.y += (target.y-openG.rotation.y)*0.08; }
      renderer.render(scene,camera);
    })();
  }
  boot();
})();
</script>
</body>
</html>
